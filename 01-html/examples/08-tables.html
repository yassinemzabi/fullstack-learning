<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tables</title>
</head>
<body>

  <h1>HTML Tables</h1>

  <table border="1">
    <caption>Student Grades</caption>

    <thead>
      <tr>
        <th>Name</th>
        <th colspan="2">Scores</th>
      </tr>
      <tr>
        <th></th>
        <th>Math</th>
        <th>CS</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>Yassine</td>
        <td>18</td>
        <td>19</td>
      </tr>
      <tr>
        <td rowspan="2">Amine</td>
        <td>16</td>
        <td>17</td>
      </tr>
      <tr>
        <td>15</td>
        <td>16</td>
      </tr>
    </tbody>

    <tfoot>
      <tr>
        <td colspan="3">End of table</td>
      </tr>
    </tfoot>
  </table>

</body>
</html>
