<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced Input Types</title>
</head>
<body>

  <h1>Advanced Form Inputs</h1>

  <form>

    <div>
    <!-- Color -->
    <label for="color">Choose a color:</label>
    <input
      type="color"
      id="color"
      name="color"
      value="#ff0000"
    >

    </div>
    <br><br>

    <div>
    <!-- File -->
    <label for="file">Upload a file:</label>
    <input
      type="file"
      id="file"
      name="file"
    >

    </div>
    <br><br>

    <div>
    <!-- Range -->
    <label for="range">Volume:</label>
    <input
      type="range"
      id="range"
      name="volume"
      min="0"
      max="100"
      step="10"
      value="50"
    >
    </div>


    <br><br>

    <div>
    <!-- Search -->
    <label for="search">Search:</label>
    <input
      type="search"
      id="search"
      name="search"
      placeholder="Search here"
    >

    </div>


    <br><br>


    <div>
    <!-- URL -->
    <label for="website">Website:</label>
    <input
      type="url"
      id="website"
      name="website"
      placeholder="https://example.com"
      required
    >

    </div>
    <br><br>

    <input type="submit" value="Submit">

  </form>

</body>
</html>
