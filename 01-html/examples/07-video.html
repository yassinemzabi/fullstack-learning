<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Example</title>
</head>
<body>

  <h1>Video in HTML</h1>

  <video
    width="640"
    height="360"
    controls
    loop
    muted
    autoplay
    preload="metadata"
    poster="../images/video-poster.jpg"
  >
    <source src="../videos/video.mp4" type="video/mp4">
    <source src="../videos/video.webm" type="video/webm">
    <source src="../videos/video.ogv" type="video/ogg">
    
    <track
      src="../subtitles/subtitles-en.vtt"
      kind="subtitles"
      label="English"
      srclang="en"
      default
    >

    Your browser does not support the video tag.
  </video>

</body>
</html>




<!--
==========================
preload attribute (audio / video)
==========================

وظيفة preload:
تحدد للمتصفح ماذا يفعل بملف الفيديو قبل أن يضغط المستخدم زر التشغيل (Play).

القيم التي يمكن أن يأخذها preload:

1) preload="none"
- لا يتم تحميل أي جزء من الفيديو.
- المتصفح ينتظر حتى يضغط المستخدم Play.
متى نستخدمه؟
- عند وجود عدة فيديوهات في الصفحة.
- لتقليل استهلاك الإنترنت.
العيب:
- التشغيل يكون أبطأ عند الضغط على Play.

2) preload="metadata"  (الأفضل غالبًا)
- يتم تحميل معلومات فقط عن الفيديو:
  • مدة الفيديو
  • الأبعاد
  • بعض البيانات الأساسية
متى نستخدمه؟
- عند الرغبة في توازن بين الأداء وسرعة التشغيل.
- هذا هو الخيار الأكثر استعمالًا.

3) preload="auto"
- المتصفح قد يقوم بتحميل الفيديو كاملًا أو جزءًا كبيرًا منه.
متى نستخدمه؟
- فيديو قصير.
- تريد تشغيلًا شبه فوري.
العيب:
- يستهلك إنترنت أكثر.

الخلاصة:
- none → توفير الإنترنت
- metadata → الخيار الذكي والمتوازن
- auto → سرعة تشغيل أعلى مقابل استهلاك أعلى


==========================
track + kind attribute
==========================

وسم <track> يُستخدم لإضافة نص مرافق للفيديو (ترجمة، شروحات، بيانات).

وظيفة kind:
تحدد نوع النص ولماذا هو موجود.

القيم المختلفة لـ kind:

1) kind="subtitles"
- ترجمة الكلام فقط.
- لا تحتوي على وصف الأصوات.
متى نستخدمها؟
- ترجمة لغة (مثلاً من الإنجليزية إلى العربية).

2) kind="captions"
- ترجمة الكلام + وصف الأصوات (music, noise, door slams).
- مفيدة لذوي الإعاقة السمعية.
- غالبًا تظهر كزر CC في المتصفح.
(الأفضل في أغلب الحالات التعليمية)

3) kind="descriptions"
- وصف بصري لما يحدث في الفيديو.
- يُستخدم مع قارئ الشاشة لذوي الإعاقة البصرية.
(نادر الاستعمال)

4) kind="chapters"
- تقسيم الفيديو إلى فصول أو أقسام.
- مفيد للفيديوهات الطويلة (محاضرات، دروس).

5) kind="metadata"
- بيانات مخفية تُستخدم مع JavaScript.
- لا تظهر للمستخدم.

الخلاصة:
- subtitles → ترجمة لغة
- captions → ترجمة + أصوات (الأفضل غالبًا)
- chapters → تقسيم الفيديو
-->
