<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Links and IDs</title>
</head>
<body>

  <h1>Links Example</h1>

  <!-- External links -->
  <p>
    <a href="https://www.google.com" target="_blank">
      Open Google in new tab
    </a>
  </p>

  <p>
    <a href="https://www.wikipedia.org">
      Open Wikipedia in same tab
    </a>
  </p>

  <p>
    <a href="mailto:someone@gmail.com">
      Open email in same tab
    </a>
  </p>


  <p>
    <a href="tel:+1234567890">
      phone call
    </a>
  </p>

    <p>
    <a href="javascript:alert('Hello!');">
        javascript    
    </a>
  </p>



  <p>
    <a href="09-lists.html">
      Open list.html page in same tab
    </a>
  </p>

  <hr>

  <!-- Internal links using id -->
  <p>
    <a href="#section1">Go to Section 1</a> |
    <a href="#section2">Go to Section 2</a>
  </p>

  <section id="section1">
    <h2>Section 1</h2>
    <p>This section has id="section1".</p>
  </section>

  <section id="section2">
    <h2>Section 2</h2>
    <p>This section has id="section2".</p>
  </section>

</body>
</html>
