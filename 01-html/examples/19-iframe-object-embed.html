<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Iframe, Object & Embed</title>
</head>
<body>

  <h1>Iframe Example</h1>

  <!-- iframe -->
  <iframe
    src="https://www.youtube.com/embed/9T0aSjBiusU"
    title="Example Website"
    width="400"
    height="250"
    frameborder="0"
    scrolling="no"
  ></iframe>

  <hr>

  <h2>Object Example (HTML)</h2>

  <!-- object -->
  <object
    data="result.html"
    type="text/html"
    width="400"
    height="250"
    
  >
    PDF cannot be displayed
  </object>

  <hr>

  <h2>Embed Example (PDF)</h2>

  <!-- embed -->
  <embed
    src="../images/html.jpg"
    type="image/jpeg"
    width="400"
    height="250"
  >

</body>
</html>
