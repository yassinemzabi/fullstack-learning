<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Containers & Semantic Elements</title>
</head>
<body>

  <!-- div = container بلا معنى، فقط لتنظيم العناصر -->
  <div>
    <h1>My Website</h1>
    <p>This part is inside a div container.</p>
  </div>

  <hr>

  <!-- Semantic structure example -->
  <header>
    <h1>My Website</h1>
    <p>Welcome to my page</p>
  </header>

  <nav>
    <a href="#">Home</a> |
    <a href="#">About</a> |
    <a href="#">Contact</a>
  </nav>

  <main>
    <section>
      <h2>Section Title</h2>
      <p>This is a section (group of related content).</p>
    </section>

    <article>
      <h2>Article Title</h2>
      <p>This is an article (independent content).</p>
    </article>

    <aside>
      <p>This is an aside (extra side information).</p>
    </aside>
  </main>

  <footer>
    <small>© 2025 Yassine</small>
  </footer>

</body>
</html>


<!--
====================================
Semantic HTML Elements (شرح مبسّط)
====================================

الفكرة الأساسية:
- Semantic Elements = عناصر لها "معنى".
- المتصفح، محركات البحث (SEO)، وقارئ الشاشة يفهمون دور كل جزء من الصفحة.
- استعمل Semantic Element عندما يصف المحتوى.
- استعمل div فقط عندما لا يوجد عنصر semantic مناسب.

------------------------------------
<header>
------------------------------------
- الجزء العلوي من الصفحة أو من section/article.
- يحتوي غالبًا على:
  • عنوان الموقع
  • شعار
  • مقدمة قصيرة
متى أستعمله؟
- أعلى الصفحة
- أو أعلى قسم معيّن

------------------------------------
<nav>
------------------------------------
- يحتوي على روابط التنقّل.
- مثل: Home / About / Contact
متى أستعمله؟
- عندما تكون الروابط للتنقّل داخل الموقع
❌ لا تستعمله لروابط عادية داخل النص

------------------------------------
<main>
------------------------------------
- المحتوى الرئيسي للصفحة.
- يجب أن يوجد مرة واحدة فقط في الصفحة.
متى أستعمله؟
- لكل محتوى الصفحة الأساسي
❌ لا تضع header أو footer داخله

------------------------------------
<section>
------------------------------------
- مجموعة محتوى لها نفس الموضوع.
- غالبًا تحتوي على عنوان (h2, h3).
متى أستعمله؟
- تقسيم الصفحة إلى أقسام منطقية
مثال:
- قسم خدمات
- قسم معلومات

------------------------------------
<article>
------------------------------------
- محتوى مستقل يمكن فهمه لوحده.
متى أستعمله؟
- مقال
- خبر
- بطاقة منتج
- منشور مدونة
قاعدة:
- إذا يمكن نسخه لوحده ويظل منطقيًا → article

------------------------------------
