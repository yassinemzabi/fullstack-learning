<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Radio & Checkbox</title>
</head>
<body>
    
    <h1>Radio and Checkbox Example</h1>
    <fieldset>
        <legend>Radio and Checkbox Example</legend>
        <form>
            <fieldset>
                <legend>Choose your level (Radio - one choice)</legend>
                <div>
                    <input type="radio" id="beginner" name="level" value="beginner" checked>
                    <label for="beginner">Beginner</label>
                </div>
                <br>
                <div>
                    <input type="radio" id="intermediate" name="level" value="intermediate">
                    <label for="intermediate">Intermediate</label>
                </div>
                <br>
                <div>
                    <input type="radio" id="advanced" name="level" value="advanced">
                    <label for="advanced">Advanced</label>
                </div> 
            </fieldset>

            <br>

            <fieldset>
                <legend>Choose your skills (Checkbox - multiple choices)</legend>
                <div>
                    <input type="checkbox" id="html" name="skills" value="html" checked>
                    <label for="html">HTML</label>
                </div>
                <br>
                <div>
                    <input type="checkbox" id="css" name="skills" value="css">
                    <label for="css">CSS</label>
                </div>
                <br>
                </div>
                    <input type="checkbox" id="js" name="skills" value="javascript">
                    <label for="js">JavaScript</label>
                </div>
            </fieldset>
            <br>
            <input type="submit" value="Submit">
        </form>
    </fieldset>
</body>
</html>
