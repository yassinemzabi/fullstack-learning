<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Buttons Example</title>
</head>
<body>

  <h1>Buttons in HTML</h1>

  <form>

    <label for="name">Name:</label>
    <input id="name" name="name" type="text" placeholder="Your name">
    <br><br>

    <!-- SUBMIT -->
    <input type="submit" value="Submit (input)">
    <br><br>

    <!-- RESET -->
    <input type="reset" value="Reset (input)">
    <br><br>

    

    <!-- BUTTON TAG -->
    

  </form>

</body>
</html>
